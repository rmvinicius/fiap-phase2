apiVersion: v1
kind: PersistentVolume
metadata:
  name: dynamodb-pv
spec:
  storageClassName: local-storage
  claimRef:
    name: dynamodb-pvc
    namespace: dynamodb
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/volumes/dynamodb"
    type: DirectoryOrCreate