apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-configmap
  namespace: redis
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    
    appendonly yes
    appendfsync everysec

    save 60 1000
    
    loglevel notice
    logfile ""
  
    slowlog-log-slower-than 10000
    slowlog-max-len 128
  
    save 60 1000
    save 300 100
    save 900 10