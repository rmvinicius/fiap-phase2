apiVersion: v1
kind: PersistentVolume
metadata:
  name: auth-service-db-pv
spec:
  storageClassName: local-storage
  claimRef:
    name: auth-service-db-pvc
    namespace: postgres
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/volumes/auth_db"
    type: DirectoryOrCreate