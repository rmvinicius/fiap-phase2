apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service-db
  namespace: postgres
  labels:
    app: flag-service-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag-service-db
  template:
    metadata:
      labels:
        app: flag-service-db
    spec:
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
      - name: flag-service-db
        image: custom-postgres:17
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
        #  readOnlyRootFilesystem: false
        resources:
          limits:
            cpu: "200m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "256Mi"
        startupProbe:
          exec:
            command:
              - pg_isready
              - -U
              - flag_service
              - -d
              - flags_db
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 9
        livenessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - flag_service
              - -d
              - flags_db
          initialDelaySeconds: 10
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
              - "psql"
              - "-w"
              - "-U"
              - "flag_service"
              - "-d"
              - "flags_db"
              - "-c"
              - "SELECT 1;"
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              key: POSTGRES_DB
              name: flag-service-db-configmap
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              key: POSTGRES_USER
              name: flag-service-db-configmap
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: flag-service-db-secret
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: flag-service-db-pvc
      restartPolicy: Always
