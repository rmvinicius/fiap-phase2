apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-nginx
  namespace: ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
        - path: /auth-service(/|$)(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: auth-service-backend
              port:
                number: 8001
        - path: /flag-service(/|$)(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: flag-service-backend
              port:
                number: 8002
        - path: /targeting-service(/|$)(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: targeting-service-backend
              port:
                number: 8003
        - path: /evaluation-service(/|$)(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: evaluation-service-backend
              port:
                number: 8004
        - path: /analytics-service(/|$)(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: analytics-service-backend
              port:
                number: 8005