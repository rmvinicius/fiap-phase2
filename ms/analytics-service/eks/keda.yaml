apiVersion: v1
kind: Secret
metadata:
  name: analytics-service-keda-secrets
  namespace: application
type: Opaque
data:
  AWS_ACCESS_KEY_ID: QVNJQVJEWlpJVFlGUzJXR000TEI=
  AWS_SECRET_ACCESS_KEY: WHNQVGlSQVp3aXU1SWlJU2JqTUNOVWJ0RTBlaEE3cDQ3Y3Y4Vk9vNA==
  AWS_SESSION_TOKEN: 
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: analytics-service-keda-trigger-auth-aws-credentials
  namespace: application
spec:
  secretTargetRef:
  - parameter: awsAccessKeyID
    name: analytics-service-keda-secrets
    key: AWS_ACCESS_KEY_ID
  - parameter: awsSecretAccessKey
    name: analytics-service-keda-secrets
    key: AWS_SECRET_ACCESS_KEY
  - parameter: awsSessionToken
    name: analytics-service-keda-secrets
    key: AWS_SESSION_TOKEN
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: analytics-service-keda-sqs-scale
  namespace: application
spec:
  scaleTargetRef:
    kind: Deployment
    name: analytics-service
  minReplicaCount: 0
  maxReplicaCount: 5
  cooldownPeriod:  30
  pollingInterval: 10
  triggers:
  - type: aws-sqs-queue
    authenticationRef:
      name: analytics-service-keda-trigger-auth-aws-credentials
    metadata:
      queueURL: queue-toggle-master
      queueLength: "5"
      awsRegion: "us-east-1"